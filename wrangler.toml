# Cloudflare Pages / Workers Configuration for Kurmagram Vedic Village
name = "kurmagram-vedic-village"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"

# Optional: Cloudflare D1 Database binding
# In Cloudflare Dashboard: Pages -> Settings -> Functions -> D1 Database Bindings
# Variable name: DB
# Database: kurmagram-db
[[d1_databases]]
binding = "DB"
database_name = "kurmagram-db"
database_id = "local-dev"
