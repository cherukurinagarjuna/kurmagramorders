<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice" class="topographic-terrain-svg" aria-hidden="true">
  <defs>
    <style>
      .topo-base-line {
        fill: none;
        stroke: #1E3F66; /* Sacred Vat Indigo */
        stroke-width: 1.1px;
        stroke-opacity: 0.08;
        vector-effect: non-scaling-stroke;
      }
      .topo-index-line {
        fill: none;
        stroke: #1E3F66;
        stroke-width: 1.6px;
        stroke-opacity: 0.14;
        vector-effect: non-scaling-stroke;
      }
      .topo-brass-line {
        fill: none;
        stroke: #B5944B; /* Antique Temple Brass */
        stroke-width: 1.2px;
        stroke-opacity: 0.18;
        vector-effect: non-scaling-stroke;
      }
      .topo-flow-pulse {
        fill: none;
        stroke: #B5944B;
        stroke-width: 1.8px;
        stroke-dasharray: 12 18;
        stroke-opacity: 0.35;
        animation: topoPulseFlow 30s linear infinite;
        vector-effect: non-scaling-stroke;
      }
      .topo-label {
        font-family: 'Source Sans 3', sans-serif;
        font-size: 10px;
        font-weight: 600;
        fill: #1E3F66;
        fill-opacity: 0.28;
        letter-spacing: 0.08em;
      }
      .topo-coord {
        font-family: 'Ramabhadra', 'Source Sans 3', sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #B5944B;
        fill-opacity: 0.38;
      }
      @keyframes topoPulseFlow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -600; }
      }
      .topo-layer-drift {
        animation: topoDrift 28s ease-in-out infinite alternate;
        transform-origin: center center;
        will-change: transform;
      }
      @keyframes topoDrift {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(12px, -8px) scale(1.008); }
        100% { transform: translate(-8px, 10px) scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .topo-flow-pulse, .topo-layer-drift {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Ambient Drift Group -->
  <g class="topo-layer-drift">
    <!-- Valley Contours -->
    <path d="M -50 720 C 300 780, 600 620, 950 680 C 1250 730, 1450 610, 1650 640" class="topo-index-line" />
    <path d="M -50 660 C 280 720, 580 570, 920 620 C 1220 670, 1420 560, 1650 590" class="topo-base-line" />
    <path d="M -50 600 C 260 650, 550 510, 890 560 C 1190 610, 1390 500, 1650 530" class="topo-base-line" />
    <path d="M -50 540 C 240 590, 520 460, 860 500 C 1160 550, 1360 450, 1650 480" class="topo-index-line" />
    <path d="M -50 480 C 220 520, 490 400, 830 440 C 1130 490, 1330 390, 1650 420" class="topo-base-line" />
    <path d="M -50 420 C 200 460, 460 350, 800 380 C 1100 430, 1300 340, 1650 370" class="topo-base-line" />
    <path d="M -50 360 C 180 400, 430 290, 770 320 C 1070 370, 1270 280, 1650 310" class="topo-index-line" />
    <path d="M -50 300 C 160 340, 400 240, 740 270 C 1040 310, 1240 230, 1650 260" class="topo-base-line" />
    <path d="M -50 240 C 140 270, 370 180, 710 210 C 1010 260, 1210 170, 1650 200" class="topo-base-line" />
    <path d="M -50 180 C 120 210, 340 130, 680 150 C 980 200, 1180 120, 1650 150" class="topo-index-line" />
    <path d="M -50 120 C 100 150, 310 70, 650 100 C 950 140, 1150 60, 1650 90" class="topo-base-line" />
    <path d="M -50 60 C 80 80, 280 20, 620 40 C 920 90, 1120 10, 1650 40" class="topo-base-line" />

    <!-- Eastern Ridge Contours -->
    <path d="M 750 -50 C 850 120, 1050 220, 1280 210 C 1480 200, 1600 90, 1650 -20" class="topo-index-line" />
    <path d="M 820 -50 C 910 90, 1080 170, 1270 160 C 1440 150, 1550 60, 1620 -50" class="topo-base-line" />
    <path d="M 890 -50 C 960 60, 1110 130, 1260 120 C 1400 110, 1500 40, 1560 -50" class="topo-index-line" />
    <path d="M 960 -50 C 1010 40, 1140 90, 1250 80 C 1350 70, 1430 20, 1490 -50" class="topo-base-line" />
    <path d="M 1040 -50 C 1080 10, 1170 50, 1240 45 C 1310 40, 1370 10, 1410 -50" class="topo-index-line" />
    <path d="M -50 450 C 120 470, 260 560, 250 680 C 240 760, 150 820, 50 850" class="topo-base-line" />
    <path d="M -50 510 C 80 530, 190 600, 180 700 C 170 770, 110 820, 10 850" class="topo-index-line" />
    <path d="M -50 570 C 40 590, 120 640, 110 720 C 100 770, 60 820, -20 850" class="topo-base-line" />

    <!-- Antique Brass Contour Layers -->
    <path d="M -50 500 C 350 420, 650 580, 1050 480 C 1350 400, 1500 520, 1650 460" class="topo-brass-line" />
    <path d="M -50 200 C 400 120, 750 280, 1150 180 C 1400 120, 1550 220, 1650 180" class="topo-brass-line" />
    
    <!-- Flowing Prana/Water Pulse Stream -->
    <path d="M -50 480 C 220 520, 490 400, 830 440 C 1130 490, 1330 390, 1650 420" class="topo-flow-pulse" />
    <path d="M 750 -50 C 850 120, 1050 220, 1280 210 C 1480 200, 1600 90, 1650 -20" class="topo-flow-pulse" />

    <!-- Cartographic Elevation Annotations -->
    <text x="320" y="555" class="topo-label" transform="rotate(-8 320 555)">110m — వంశధార లోయ</text>
    <text x="890" y="525" class="topo-label" transform="rotate(7 890 525)">130m — నంద గోకులం క్షేత్రం</text>
    <text x="1220" y="185" class="topo-label" transform="rotate(-3 1220 185)">155m — కూర్మ శిఖరం</text>
    <text x="980" y="115" class="topo-label" transform="rotate(-15 980 115)">170m</text>
    <text x="140" y="705" class="topo-label" transform="rotate(12 140 705)">95m</text>

    <!-- Geographic Coordinate Watermark -->
    <g transform="translate(1380, 740)">
      <text class="topo-coord" text-anchor="end">18°35′32″ N • 84°01′14″ E &bull; 60 ACRES</text>
    </g>
  </g>
</svg>
