<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <!-- Sacred Andhra Rice-Flour Muggulu / Kolam Grid: 2px Iron-Black Stroke -->
  <g stroke="#231F1D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Lotus Square Frame -->
    <rect x="20" y="20" width="200" height="200" rx="8" fill="#FAF6EE" stroke="#231F1D" stroke-width="2"/>
    <rect x="28" y="28" width="184" height="184" rx="4" stroke="#B5944B" stroke-width="1.2" stroke-dasharray="4 4"/>

    <!-- Central Symmetrical Loop Grid (Traditional 5x5 Dot Matrix) -->
    <!-- Center Bindu (Turmeric) -->
    <circle cx="120" cy="120" r="5" fill="#D97706" stroke="#231F1D" stroke-width="1.8"/>

    <!-- 4 Cardinal Loops -->
    <path d="M 120 70 C 100 70 100 110 120 110 C 140 110 140 70 120 70 Z" fill="#FFFDF9" stroke="#231F1D" stroke-width="2"/>
    <path d="M 120 170 C 100 170 100 130 120 130 C 140 130 140 170 120 170 Z" fill="#FFFDF9" stroke="#231F1D" stroke-width="2"/>
    <path d="M 70 120 C 70 100 110 100 110 120 C 110 140 70 140 70 120 Z" fill="#FFFDF9" stroke="#231F1D" stroke-width="2"/>
    <path d="M 170 120 C 170 100 130 100 130 120 C 130 140 170 140 170 120 Z" fill="#FFFDF9" stroke="#231F1D" stroke-width="2"/>

    <!-- 4 Diagonal Lotus Petals (Madder Red & Harita Green) -->
    <path d="M 85 85 Q 120 60 120 85 Q 95 95 85 85 Z" fill="#A62B2B"/>
    <path d="M 155 85 Q 120 60 120 85 Q 145 95 155 85 Z" fill="#A62B2B"/>
    <path d="M 85 155 Q 120 180 120 155 Q 95 145 85 155 Z" fill="#A62B2B"/>
    <path d="M 155 155 Q 120 180 120 155 Q 145 145 155 155 Z" fill="#A62B2B"/>

    <!-- 4 Corner Dots -->
    <circle cx="50" cy="50" r="3.5" fill="#2D6A4F" stroke="#231F1D" stroke-width="1.5"/>
    <circle cx="190" cy="50" r="3.5" fill="#2D6A4F" stroke="#231F1D" stroke-width="1.5"/>
    <circle cx="50" cy="190" r="3.5" fill="#2D6A4F" stroke="#231F1D" stroke-width="1.5"/>
    <circle cx="190" cy="190" r="3.5" fill="#2D6A4F" stroke="#231F1D" stroke-width="1.5"/>
  </g>
</svg>
