<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240" fill="none">
  <!-- Go Ark (Sacred Cow Distillate) Illustration: Cow Silhouette + Copper Distillation Still -->
  <defs>
    <linearGradient id="copperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#df8244"/>
      <stop offset="60%" stop-color="#b85d24"/>
      <stop offset="100%" stop-color="#8c3e10"/>
    </linearGradient>
    <linearGradient id="arkDroplet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#90caf9"/>
    </linearGradient>
  </defs>

  <!-- Halo -->
  <circle cx="150" cy="120" r="95" fill="#faf5e9" stroke="#6b4f2a" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Cow Silhouette in Background -->
  <g transform="translate(60, 58) scale(0.68)" opacity="0.3" fill="#2f6b3a">
    <path d="M40 70 Q55 35 75 35 Q90 35 105 50 Q130 45 155 55 Q175 65 185 85 L180 125 L170 125 L165 95 L145 95 L140 125 L130 125 L135 85 Q110 90 90 85 L85 125 L75 125 L78 85 L60 85 L55 125 L45 125 L48 80 Q35 85 30 75 Z"/>
    <ellipse cx="95" cy="42" rx="14" ry="12"/>
    <path d="M45 60 Q30 55 22 45 Q20 35 28 32 Q35 40 45 52 Z"/>
    <path d="M35 38 Q42 22 48 18 Q45 28 40 38 Z"/>
    <path d="M26 40 Q12 40 16 48 Z"/>
  </g>

  <!-- Copper Distillation Pot (Vessel) -->
  <g id="copperStill" transform="translate(45, 10)">
    <!-- Stand / Base -->
    <path d="M85 178 L75 190 M135 178 L145 190 M110 178 L110 190" stroke="#6b4f2a" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Pot Body -->
    <circle cx="110" cy="140" r="38" fill="url(#copperGrad)" stroke="#6b4f2a" stroke-width="2"/>
    
    <!-- Pot Rim / Neck -->
    <rect x="98" y="94" width="24" height="12" rx="2" fill="#df8244" stroke="#6b4f2a" stroke-width="2"/>

    <!-- Swan Neck Condensation Pipe -->
    <path d="M110 94 C110 70 150 65 160 85 C168 100 160 125 175 135" fill="none" stroke="#b85d24" stroke-width="5" stroke-linecap="round"/>
    <path d="M110 94 C110 70 150 65 160 85 C168 100 160 125 175 135" fill="none" stroke="#6b4f2a" stroke-width="1.5" stroke-dasharray="1 1"/>

    <!-- Decorative bands on pot -->
    <path d="M82 135 Q110 148 138 135" stroke="#faf5e9" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- Collection Beaker / Glass with Pure Ark -->
  <g transform="translate(205, 135)">
    <path d="M5 25 L12 48 C14 52 18 55 25 55 C32 55 36 52 38 48 L45 25 Z" fill="#fffdf7" stroke="#6b4f2a" stroke-width="2"/>
    <!-- Liquid -->
    <path d="M9 34 L13 47 C15 50 18 53 25 53 C32 53 35 50 37 47 L41 34 Z" fill="url(#arkDroplet)"/>

    <!-- Falling Pure Essence Droplet -->
    <path d="M25 5 C25 5 31 15 31 20 C31 23 28 26 25 26 C22 26 19 23 19 20 C19 15 25 5 25 5 Z" fill="url(#arkDroplet)" stroke="#1f7a8c" stroke-width="1.2"/>
  </g>
</svg>
