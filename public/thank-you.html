<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Received — Rice Traders</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <style>
    body { background: #f5f5f5; }
    .card { border: none; box-shadow: 0 1px 8px rgba(0,0,0,.08); }
    .icon-wrap {
      width: 72px; height: 72px; border-radius: 50%;
      background: #e8f5e9;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; margin: 0 auto 1rem;
    }
    .order-code {
      font-family: monospace;
      font-size: 1.5rem;
      letter-spacing: .05em;
      color: #2e7d32;
      word-break: break-all;
    }
    .btn-success { background: #2e7d32; border-color: #2e7d32; }
    .btn-success:hover { background: #1b5e20; border-color: #1b5e20; }
  </style>
</head>
<body>
  <nav class="navbar navbar-light bg-white border-bottom mb-4 shadow-sm">
    <div class="container">
      <a href="index.html" class="navbar-brand fw-bold text-success">🌾 Rice Traders</a>
    </div>
  </nav>

  <main class="container" style="max-width:520px">
    <div class="card p-4 text-center">
      <div class="icon-wrap">✅</div>
      <h1 class="h4 fw-bold text-success">Order Placed!</h1>
      <p class="text-muted mb-3">
        Your order has been received. We'll confirm it on WhatsApp shortly.
      </p>

      <div class="bg-light rounded p-3 mb-4">
        <p class="text-muted small mb-1">Your Order Code</p>
        <div class="order-code" id="orderCode">—</div>
        <p class="text-muted" style="font-size:.78rem" class="mt-1">
          Save this code to track your order later.
        </p>
      </div>

      <a id="trackLink" href="track.html" class="btn btn-success w-100 mb-2 py-2 fw-semibold">
        📦 Track My Order
      </a>
      <a href="index.html" class="btn btn-link text-muted small">Place another order</a>
    </div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmL3JCzNNUqV1dqe/9uFV7hqj/"
    crossorigin="anonymous"
  ></script>
  <script src="assets/app.js"></script>
  <script>initThankYou();</script>
</body>
</html>
