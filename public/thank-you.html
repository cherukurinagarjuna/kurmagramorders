<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Received | Rice Traders</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <style>
    body { background: #f8f4ee; }
    .brand-green { color: #2e7d32; }
    .icon-circle {
      width: 72px; height: 72px;
      background: #e8f5e9;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1rem;
    }
    .card { border: none; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  </style>
</head>
<body>
  <nav class="navbar navbar-light bg-white border-bottom mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold brand-green">🌾 Rice Traders</span>
    </div>
  </nav>

  <main class="container" style="max-width: 540px;">
    <div class="card p-4 text-center">
      <div class="icon-circle">✅</div>
      <h1 class="h4 fw-bold brand-green">Order Placed!</h1>
      <p class="text-muted mb-3">
        Your order has been received. We'll confirm it on WhatsApp shortly.
      </p>

      <!-- Order summary injected by JS -->
      <div id="orderSummary" class="text-start bg-light rounded p-3 mb-3 small d-none">
        <div class="row g-1">
          <div class="col-5 text-muted">Order ID</div>
          <div class="col-7 fw-semibold" id="sumOrderId">—</div>

          <div class="col-5 text-muted">Rice Variety</div>
          <div class="col-7" id="sumRiceType">—</div>

          <div class="col-5 text-muted">Quantity</div>
          <div class="col-7" id="sumQuantity">—</div>

          <div class="col-5 text-muted">Mobile (masked)</div>
          <div class="col-7" id="sumPhone">—</div>
        </div>
      </div>

      <a id="trackLink" href="track.html" class="btn btn-outline-success mb-2 w-100">
        Track My Order
      </a>
      <a href="index.html" class="btn btn-link text-muted small">Place another order</a>
    </div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmL3JCzNNUqV1dqe/9uFV7hqj/"
    crossorigin="anonymous"
  ></script>
  <script src="assets/app.js"></script>
  <script>
    initThankYou();
  </script>
</body>
</html>
