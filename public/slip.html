<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Courier Dispatch Slip</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <style>
    body {
      background: #f8f9fa;
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .slip-container {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border: 2px dashed #333;
      border-radius: 4px;
    }

    .slip-field {
      margin-bottom: 14px;
      font-size: 1.15rem;
      line-height: 1.5;
    }

    .slip-label {
      font-weight: 700;
      display: inline-block;
      min-width: 130px;
    }

    .slip-value {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .action-bar {
      max-width: 560px;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Print styles */
    @media print {
      body {
        background: #fff !important;
        padding: 0 !important;
      }
      .action-bar, #loadingState, #errorAlert {
        display: none !important;
      }
      .slip-container {
        border: 2px solid #000 !important;
        box-shadow: none !important;
        margin: 0 !important;
        max-width: 100% !important;
        padding: 20px !important;
      }
    }
  </style>
</head>
<body>

  <!-- Controls at top -->
  <div class="action-bar">
    <button class="btn btn-primary" onclick="window.print()">🖨️ Print Slip</button>
    <button class="btn btn-outline-secondary" onclick="window.close()">Close Window</button>
  </div>

  <div id="errorAlert" class="container" style="max-width: 560px;"></div>

  <div id="loadingState" class="text-center py-5 text-muted">
    <div class="spinner-border spinner-border-sm text-secondary me-2" role="status"></div>
    Loading dispatch slip…
  </div>

  <!-- Dispatch Slip Content -->
  <div class="slip-container d-none" id="slipContent">
    <div class="slip-field">
      <span class="slip-label">Name:</span>
      <span class="slip-value" id="dispName">—</span>
    </div>

    <div class="slip-field">
      <span class="slip-label" style="vertical-align: top;">Address:</span>
      <span class="slip-value" id="dispAddress">—</span>
    </div>

    <div class="slip-field">
      <span class="slip-label">Phone number:</span>
      <span class="slip-value" id="dispPhone">—</span>
    </div>

    <div class="slip-field">
      <span class="slip-label">Quantity:</span>
      <span class="slip-value" id="dispProduct">—</span>
    </div>

    <div class="slip-field" style="margin-bottom: 0;">
      <span class="slip-label">Customer Order Number:</span>
      <span class="slip-value fw-bold font-monospace" id="dispOrderCode">—</span>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (async function initSlip() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const errBox = document.getElementById('errorAlert');
      const loading = document.getElementById('loadingState');
      const content = document.getElementById('slipContent');

      if (!id) {
        loading.classList.add('d-none');
        errBox.innerHTML = '<div class="alert alert-danger">No order ID specified in URL.</div>';
        return;
      }

      try {
        const data = await getJSON('/.netlify/functions/get-order?id=' + encodeURIComponent(id));
        const order = data.order;

        document.getElementById('dispName').textContent = order.customer_name || '—';
        document.getElementById('dispAddress').textContent = order.delivery_address || '—';
        document.getElementById('dispPhone').textContent = order.customer_phone || '—';
        document.getElementById('dispProduct').textContent = order.product_details || '—';
        document.getElementById('dispOrderCode').textContent = order.order_code || '—';

        loading.classList.add('d-none');
        content.classList.remove('d-none');
      } catch (err) {
        loading.classList.add('d-none');
        errBox.innerHTML = '<div class="alert alert-danger">Failed to load order: ' + escapeHtml(err.message) + '</div>';
      }
    })();
  </script>
</body>
</html>
