<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Rice Traders</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <style>
    body { background: #f5f5f5; }
    .card  { border: none; box-shadow: 0 1px 8px rgba(0,0,0,.08); }
    .btn-primary { background: #2e7d32; border-color: #2e7d32; }
    .btn-primary:hover { background: #1b5e20; border-color: #1b5e20; }

    /* Login centred */
    #loginSection {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    #loginCard { width: 100%; max-width: 380px; }

    /* Table tweaks */
    #ordersTable th  { font-size: .78rem; white-space: nowrap; color: #555; }
    #ordersTable td  { font-size: .82rem; vertical-align: middle; }
    .font-monospace  { font-family: 'Courier New', monospace; }
  </style>
</head>
<body>

  <!-- ══════════════ LOGIN ══════════════ -->
  <div id="loginSection">
    <div id="loginCard" class="card p-4">
      <h1 class="h5 fw-bold text-success mb-1">🌾 Admin Login</h1>
      <p class="text-muted small mb-3">Enter your admin password to continue.</p>

      <div id="loginAlert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="adminPassword" class="form-label small fw-semibold">Password</label>
          <input
            type="password" id="adminPassword"
            class="form-control"
            placeholder="Admin password"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold">Log In</button>
      </form>
    </div>
  </div>

  <!-- ══════════════ PANEL ══════════════ -->
  <div id="panelSection" class="d-none">

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white border-bottom shadow-sm mb-4">
      <div class="container-fluid px-4">
        <span class="navbar-brand fw-bold text-success">🌾 Rice Traders — Admin</span>
        <div class="d-flex gap-2 align-items-center">
          <span id="orderCount" class="text-muted small me-2"></span>
          <button id="refreshBtn" class="btn btn-sm btn-outline-secondary">⟳ Refresh</button>
          <button id="logoutBtn"  class="btn btn-sm btn-outline-danger">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container-fluid px-4">

      <!-- Alerts for panel-level errors -->
      <div id="panelAlert" class="mb-3"></div>

      <!-- Filters -->
      <div class="card p-3 mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-sm-auto">
            <label for="statusFilter" class="form-label small mb-1 fw-semibold">Status</label>
            <select id="statusFilter" class="form-select form-select-sm">
              <option value="">All statuses</option>
              <option value="placed">Placed</option>
              <option value="shipped">Shipped</option>
              <option value="out_for_delivery">Out for Delivery</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="col-sm">
            <label for="searchInput" class="form-label small mb-1 fw-semibold">Search</label>
            <input
              type="text" id="searchInput"
              class="form-control form-control-sm"
              placeholder="Order code, name, or phone…"
            />
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="card p-0 overflow-hidden mb-4">

        <!-- Loading state -->
        <div id="tableLoading" class="text-center py-5 text-muted">
          <div class="spinner-border spinner-border-sm text-secondary me-2" role="status"></div>
          Loading orders…
        </div>

        <!-- Empty state -->
        <div id="tableEmpty" class="text-center py-5 text-muted d-none">
          No orders match your filter.
        </div>

        <!-- Orders table -->
        <div class="table-responsive d-none" id="tableWrapper">
          <table class="table table-hover mb-0" id="ordersTable">
            <thead class="table-light">
              <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Amount</th>
                <th>Status</th>
                <th>LR #</th>
                <th>Placed</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </div>

    </div><!-- /container -->
  </div><!-- /panelSection -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmL3JCzNNUqV1dqe/9uFV7hqj/"
    crossorigin="anonymous"
  ></script>
  <script src="assets/app.js"></script>
  <script>initAdminPage();</script>
</body>
</html>
