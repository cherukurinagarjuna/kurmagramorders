<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Track Order — Rice Traders</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <style>
    body { background: #f5f5f5; }
    .card { border: none; box-shadow: 0 1px 8px rgba(0,0,0,.08); }
    .btn-success { background: #2e7d32; border-color: #2e7d32; }
    .btn-success:hover { background: #1b5e20; border-color: #1b5e20; }
    .divider-label {
      display: flex; align-items: center; gap: .5rem;
      color: #aaa; font-size: .8rem; margin: .75rem 0;
    }
    .divider-label::before,
    .divider-label::after {
      content: ''; flex: 1; height: 1px; background: #dee2e6;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-light bg-white border-bottom mb-4 shadow-sm">
    <div class="container">
      <a href="index.html" class="navbar-brand fw-bold text-success">🌾 Rice Traders</a>
      <a href="index.html" class="btn btn-sm btn-outline-success">Place Order</a>
    </div>
  </nav>

  <main class="container" style="max-width:580px">

    <!-- Search card -->
    <div class="card p-4 mb-4">
      <h1 class="h5 fw-bold text-success mb-1">Track Your Order</h1>
      <p class="text-muted small mb-3">Enter your order code <strong>or</strong> WhatsApp number.</p>

      <div id="trackAlert"></div>

      <form id="trackForm" novalidate>
        <!-- By order code -->
        <div class="mb-2">
          <label for="trackCode" class="form-label small fw-semibold">Order Code</label>
          <input
            type="text" id="trackCode"
            class="form-control font-monospace text-uppercase"
            placeholder="RICE-2026-0001"
            autocomplete="off"
          />
        </div>

        <div class="divider-label">OR</div>

        <!-- By phone -->
        <div class="mb-3">
          <label for="trackPhone" class="form-label small fw-semibold">WhatsApp Number</label>
          <div class="input-group">
            <span class="input-group-text bg-light">+91</span>
            <input
              type="tel" id="trackPhone"
              class="form-control"
              placeholder="9876543210"
              maxlength="10"
            />
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100 fw-semibold">
          🔍 Track
        </button>
      </form>
    </div>

    <!-- Results injected here -->
    <div id="trackResults"></div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmL3JCzNNUqV1dqe/9uFV7hqj/"
    crossorigin="anonymous"
  ></script>
  <script src="assets/app.js"></script>
  <script>initTrackPage();</script>
</body>
</html>
